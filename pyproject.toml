[project]
name = "tv-cast"
version = "0.1.0"
description = "Samsung TV Video Caster - Cast videos to your Samsung TV via DLNA"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
license-files = ["LICENSE"]
authors = [
    {name = "Rich Anderson"},
]
keywords = ["dlna", "samsung-tv", "hls", "casting", "youtube", "upnp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "async-upnp-client>=0.38.0",
    "aiohttp>=3.14.4",
    "yt-dlp>=2026.7.4",
    "zeroconf>=0.149.16",
]

[project.scripts]
tv-cast = "tv_cast.__main__:main"

[project.urls]
Homepage = "https://github.com/richandersonio/tv_cast"
Issues = "https://github.com/richandersonio/tv_cast/issues"
Source = "https://github.com/richandersonio/tv_cast"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tv_cast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "PIE", "RUF"]
ignore = ["E501", "ASYNC109"]
