[project]
name = "tv-cast"
version = "0.1.0"
description = "Samsung TV Video Caster - Cast videos to your Samsung TV via DLNA"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
license-files = ["LICENSE"]
authors = [
    {name = "Rich Anderson"},
]
keywords = ["dlna", "samsung-tv", "hls", "casting", "youtube", "upnp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "async-upnp-client>=0.38.0",
    "aiohttp>=3.13.4",
    "yt-dlp>=2026.2.21",
    "pyatv>=0.14.0",
    "zeroconf>=0.80.0",
    "pillow>=12.2.0",
]

[project.scripts]
tv-cast = "tv_cast.__main__:main"

[project.urls]
Homepage = "https://github.com/richandersonio/tv_cast"
Issues = "https://github.com/richandersonio/tv_cast/issues"
Source = "https://github.com/richandersonio/tv_cast"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tv_cast"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
